global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'smythos-sre-api'
    static_configs:
      - targets: ['sre-api:8000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  - job_name: 'smythos-redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'smythos-postgres'
    static_configs:
      - targets: ['postgres:5432']
